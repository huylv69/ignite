name: Build iOS

# iOS is the only platform that builds automatically, and this is the only
# place it does: every Codemagic workflow is manual. Each run also publishes
# to the SideStore source.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    env:
      STORE_SHARE_TOKEN: AKH743YcoJRnBHa # public share of /Builds on drive.huylv.tech
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the store changelog is built from the commits since
          # the previously published build, which a shallow clone cannot reach.
          fetch-depth: 0

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      # Version comes from the commit count, not this runner's run_number.
      # Codemagic can build the same repo, and two independent counters writing
      # into one version space produce entries that go backwards. Commit count
      # is monotonic and identical wherever it is computed.
      - name: Derive version
        run: |
          N=$(git rev-list --count HEAD)
          echo "APP_VERSION=1.1.$N" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$N"    >> $GITHUB_ENV
          echo "version -> 1.1.$N"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache/hosted
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Get dependencies
        run: flutter pub get

      - name: Disable code signing completely
        run: |
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"

          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ"

          for xcconfig in ios/Flutter/Debug.xcconfig ios/Flutter/Release.xcconfig; do
            echo "CODE_SIGNING_ALLOWED=NO" >> "$xcconfig"
            echo "CODE_SIGNING_REQUIRED=NO" >> "$xcconfig"
            echo 'CODE_SIGN_IDENTITY=' >> "$xcconfig"
            echo 'CODE_SIGN_ENTITLEMENTS=' >> "$xcconfig"
            echo 'DEVELOPMENT_TEAM=' >> "$xcconfig"
          done

      - name: Build iOS
        run: flutter build ios --release --no-codesign
          --build-name=$APP_VERSION --build-number=$BUILD_NUMBER

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r ignite.ipa Payload

      # Publish to the Nextcloud store + update the SideStore source (apps.json).
      - name: Publish to store
        continue-on-error: true
        env:
          NC_USER: ${{ secrets.NC_USER }}
          NC_APP_PASSWORD: ${{ secrets.NC_APP_PASSWORD }}
          APP_SLUG: ignite
          APP_NAME: Ignite
          BUNDLE_ID: tech.huylv.ignite
          DEV_NAME: huylv
          VER: ${{ env.APP_VERSION }}
          IPA_PATH: ignite.ipa
          ICON_PATH: assets/icon/app_icon.png
          # DESC is computed inside the script from git history — see there.
          COMMIT_SHA: ${{ github.sha }}
          SHARE_TOKEN: ${{ env.STORE_SHARE_TOKEN }}
        run: |
          if [ -z "$NC_USER" ] || [ -z "$NC_APP_PASSWORD" ]; then
            echo "NC secrets not set — skipping store publish."; exit 0
          fi
          bash ci/update_store.sh

      - name: Upload IPA (artifact fallback)
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ignite.ipa
          retention-days: 7
