workflows:
  android-workflow:
    name: Ignite Android Build (APK)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: 3.41.6
      java: 17
    # Manual only — start this from the Codemagic UI or the Ignite app.
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Flutter build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - levanhuy96@gmail.com
        notify:
          success: true
          failure: true

  ios-workflow:
    name: Ignite iOS Build (IPA)
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      groups:
        - store          # NC_USER, NC_APP_PASSWORD for the SideStore publish
      vars:
        BUNDLE_ID: "tech.huylv.ignite"
      flutter: 3.41.6
      xcode: latest
    # Manual only, like every workflow here — automatic iOS builds run on
    # GitHub Actions instead. Start this from the Codemagic UI, the Ignite
    # app, or POST /builds.
    scripts:
      - name: Disable code signing completely
        script: |
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"

          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$PBXPROJ" 2>/dev/null || \
          sed -i 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$PBXPROJ"

          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ" 2>/dev/null || \
          sed -i 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ"

          for xcconfig in ios/Flutter/Debug.xcconfig ios/Flutter/Release.xcconfig; do
            echo "CODE_SIGNING_ALLOWED=NO" >> "$xcconfig"
            echo "CODE_SIGNING_REQUIRED=NO" >> "$xcconfig"
            echo 'CODE_SIGN_IDENTITY=' >> "$xcconfig"
            echo 'CODE_SIGN_ENTITLEMENTS=' >> "$xcconfig"
            echo 'DEVELOPMENT_TEAM=' >> "$xcconfig"
          done
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Flutter build iOS
        script: |
          # Version comes from the commit count so it matches whatever GitHub
          # Actions would produce for the same commit; two independent build
          # counters would otherwise publish versions that go backwards.
          N=$(git rev-list --count HEAD)
          flutter build ios --release --no-codesign \
            --build-name="1.1.$N" \
            --build-number="$N" \
            --dart-define=FLUTTER_XCODE_CODE_SIGNING_ALLOWED=NO \
            --dart-define=FLUTTER_XCODE_CODE_SIGNING_REQUIRED=NO \
            -v
      - name: Package Payload to IPA
        script: |
          cd build/ios/iphoneos/
          mkdir Payload
          cp -r Runner.app Payload/
          zip -q -r -y unsigned_ignite.ipa Payload/
      # Publishes to the Nextcloud store and rewrites the shared SideStore
      # source, so the phone gets an Update prompt. Never fail the build over
      # it — the .ipa is still attached as an artifact either way.
      - name: Publish to SideStore source
        ignore_failure: true
        script: |
          if [ -z "${NC_USER:-}" ] || [ -z "${NC_APP_PASSWORD:-}" ]; then
            echo "NC secrets not set - skipping store publish."; exit 0
          fi
          export APP_SLUG=ignite
          export APP_NAME=Ignite
          export BUNDLE_ID=tech.huylv.ignite
          export DEV_NAME=huylv
          export VER="1.1.$(git rev-list --count HEAD)"
          export IPA_PATH=build/ios/iphoneos/unsigned_ignite.ipa
          export ICON_PATH=assets/icon/app_icon.png
          export SHARE_TOKEN=AKH743YcoJRnBHa
          bash ci/update_store.sh
    artifacts:
      - build/ios/iphoneos/unsigned_ignite.ipa
    publishing:
      email:
        recipients:
          - levanhuy96@gmail.com
        notify:
          success: true
          failure: true

  linux-workflow:
    name: Ignite Linux Build
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: 3.41.6
    scripts:
      - name: Install Linux build dependencies
        script: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Flutter build Linux
        script: |
          flutter build linux --release
      - name: Archive Linux binary
        script: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../ignite-linux-x64.tar.gz .
    artifacts:
      - ignite-linux-x64.tar.gz
    publishing:
      email:
        recipients:
          - levanhuy96@gmail.com
        notify:
          success: true
          failure: true
